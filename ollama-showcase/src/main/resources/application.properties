spring.application.name=ollama-showcase

# 1. Start the server on a specific port to avoid conflicts
server.port=8080

# 2. Tell Spring AI where Ollama is running locally
spring.ai.ollama.base-url=http://localhost:11434

# 3. Specify the default chat model we want to use (Llama 3.2 is fast and smart)
spring.ai.ollama.chat.options.model=llama3.2

# 4. Expand the context window for our Controller 3 (Log Analyzer)
# This allows the AI to read massive logs without forgetting the beginning
spring.ai.ollama.chat.options.num-ctx=32768

# 5. Specify the embedding model for Controller 2 (Local RAG)
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Forces Ollama to strictly output valid JSON with no markdown or conversational filler
spring.ai.ollama.chat.options.format=json

# Sets creativity to zero so the extraction is highly deterministic and accurate
spring.ai.ollama.chat.options.temperature=0.0

logging.file.name=logs/application.log
